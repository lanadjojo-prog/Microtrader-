services:
  - type: web
    name: microtrader
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: ALPACA_PAPER
        value: "true"
      - key: LIVE_TRADING_ENABLED
        value: "false"
      - key: AUTO_START
        value: "false"
